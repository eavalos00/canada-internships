name: Update jobs
on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6-7am Toronto time
  workflow_dispatch: {}      # adds a "Run workflow" button
  push:                      # also runs right away when the scraper or company list changes
    branches: [main]
    paths: ["scrape.py", "companies.json"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scrape.py
      - name: Commit changes
        run: |
          git config user.name "campus-talent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json README.md skipped.json
          git diff --cached --quiet || git commit -m "Update jobs $(date -u +%F)"
          git push
